name: IteraDynamics CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev

      - name: Run full test suite with coverage
        run: uv run --locked python -m pytest --cov=research --cov=runtime --cov-report=term-missing

      - name: Compare refactor with independent baseline (synthetic only)
        if: matrix.python-version == '3.12'
        run: |
          git fetch --depth=1 origin 83e4e119a2a7954c470a797a590e5d9c8213d353
          git worktree add --detach "$RUNNER_TEMP/itera-refactor-baseline" FETCH_HEAD
          uv run --locked python scripts/verify_refactor_ml_parity.py --baseline-root "$RUNNER_TEMP/itera-refactor-baseline"
          uv run --locked python scripts/verify_refactor_runtime_parity.py --baseline-root "$RUNNER_TEMP/itera-refactor-baseline"
          git fetch --depth=1 origin f332255139b613af0ffa1d227585db47fb8a8fb4
          git worktree add --detach "$RUNNER_TEMP/itera-io-baseline" FETCH_HEAD
          uv run --locked python scripts/verify_artifact_io_parity.py --baseline-root "$RUNNER_TEMP/itera-io-baseline"

  smoke-backtest:
    name: Smoke Backtest (synthetic data)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --locked --extra dev

      - name: Generate synthetic data and run smoke backtest
        run: |
          uv run --locked python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from research.harness.data_loader import make_synthetic_ohlcv
          import pandas as pd

          # Generate synthetic BTC-like data
          df = make_synthetic_ohlcv(n_bars=1000, seed=42)
          df.to_csv("data/smoke_btc_1h.csv")
          print(f"Generated {len(df)} bars")
          EOF

      - name: Run trend-following backtest
        run: |
          uv run --locked python scripts/run_backtest.py \
            --data data/smoke_btc_1h.csv \
            --strategy trend_following \
            --capital 100000 \
            --no-chart
        env:
          ARTIFACTS_DIR: /tmp/artifacts

      - name: Run portfolio backtest
        run: |
          uv run --locked python scripts/run_portfolio.py \
            --data data/smoke_btc_1h.csv \
            --no-chart
        env:
          ARTIFACTS_DIR: /tmp/artifacts

      - name: Run paper trading smoke test (50 cycles)
        run: |
          uv run --locked python scripts/run_paper.py \
            --data data/smoke_btc_1h.csv \
            --cycles 50
