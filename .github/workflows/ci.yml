name: IteraDynamics CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run full test suite with coverage
        run: pytest --cov=research --cov=runtime --cov-report=term-missing

  smoke-backtest:
    name: Smoke Backtest (synthetic data)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate synthetic data and run smoke backtest
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, ".")
          from research.harness.data_loader import make_synthetic_ohlcv
          import pandas as pd

          # Generate synthetic BTC-like data
          df = make_synthetic_ohlcv(n_bars=1000, seed=42)
          df.to_csv("data/smoke_btc_1h.csv")
          print(f"Generated {len(df)} bars")
          EOF

      - name: Run trend-following backtest
        run: |
          python scripts/run_backtest.py \
            --data data/smoke_btc_1h.csv \
            --strategy trend_following \
            --capital 100000 \
            --no-chart
        env:
          ARTIFACTS_DIR: /tmp/artifacts

      - name: Run portfolio backtest
        run: |
          python scripts/run_portfolio.py \
            --data data/smoke_btc_1h.csv \
            --no-chart
        env:
          ARTIFACTS_DIR: /tmp/artifacts

      - name: Run paper trading smoke test (50 cycles)
        run: |
          python scripts/run_paper.py \
            --data data/smoke_btc_1h.csv \
            --cycles 50
